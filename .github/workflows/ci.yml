# CI da onda 0 (W0-T16; NST-00-04). Ordem do plano 23 §W0-T16. Sem certificados reais: tudo é
# assinado ad hoc (CODE_SIGN_IDENTITY=-). Sem segredos, sem publicação, sem telemetria.
# Cada job chama os mesmos scripts usados localmente (scripts/ci/*.sh).
#
# Runner: self-hosted (o Mac de desenvolvimento, rótulo rskeeper-xcode27), porque as imagens macOS
# do GitHub não têm o Xcode 27 fixado em .xcode-version.
# SEGURANÇA (repositório público): PRs vindos de forks NUNCA rodam aqui — o job toolchain é pulado
# e todos os outros dependem dele. Além disso, o repositório exige aprovação para workflows de
# qualquer colaborador externo (fork-pr-contributor-approval = all_external_contributors).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, rskeeper-xcode27]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select-xcode.sh   # Xcode de .xcode-version → DEVELOPER_DIR
      - run: scripts/check-toolchain.sh

  hygiene:
    needs: toolchain
    runs-on: [self-hosted, macOS, ARM64, rskeeper-xcode27]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select-xcode.sh   # Xcode de .xcode-version → DEVELOPER_DIR
      - run: scripts/ci/hygiene.sh

  test-kit:
    needs: hygiene
    runs-on: [self-hosted, macOS, ARM64, rskeeper-xcode27]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select-xcode.sh   # Xcode de .xcode-version → DEVELOPER_DIR
      - run: scripts/ci/test-kit.sh

  boundaries:
    needs: [test-kit, drivers-containers]
    runs-on: [self-hosted, macOS, ARM64, rskeeper-xcode27]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select-xcode.sh   # Xcode de .xcode-version → DEVELOPER_DIR
      - run: scripts/check-boundaries.sh
      - run: scripts/ci/negative-checks.sh   # cada check reprova uma violação proposital

  build:
    needs: boundaries
    runs-on: [self-hosted, macOS, ARM64, rskeeper-xcode27]
    strategy:
      fail-fast: false
      matrix:
        configuration: [Dev, Test, Release]
        sandbox: ["YES", "NO"]   # R-W0-05: as duas variantes até a decisão final
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select-xcode.sh   # Xcode de .xcode-version → DEVELOPER_DIR
      - run: scripts/ci/build.sh ${{ matrix.configuration }} ${{ matrix.sandbox }}

  test-app:
    needs: build
    runs-on: [self-hosted, macOS, ARM64, rskeeper-xcode27]
    strategy:
      fail-fast: false
      matrix:
        sandbox: ["YES", "NO"]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select-xcode.sh   # Xcode de .xcode-version → DEVELOPER_DIR
      - run: scripts/ci/test-app.sh ${{ matrix.sandbox }}
      - run: scripts/ci/fs-footprint.sh ${{ matrix.sandbox }}

  license-audit:
    needs: test-app
    runs-on: [self-hosted, macOS, ARM64, rskeeper-xcode27]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select-xcode.sh   # Xcode de .xcode-version → DEVELOPER_DIR
      - run: scripts/license-audit.sh

  artifact:
    needs: license-audit
    runs-on: [self-hosted, macOS, ARM64, rskeeper-xcode27]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select-xcode.sh   # Xcode de .xcode-version → DEVELOPER_DIR
      - run: scripts/ci/build.sh Release YES && scripts/ci/package-adhoc.sh YES
      - run: scripts/ci/log-privacy.sh YES
      - uses: actions/upload-artifact@v4
        with:
          name: RSKeeper-wave0-adhoc
          path: dist/RSKeeper-wave0-adhoc-sbYES.zip
          retention-days: 14

  # NST-00-04 crit. 2 (W1-T05): drivers contra bancos reais e descartáveis (Docker do runner próprio).
  drivers-containers:
    needs: test-kit
    runs-on: [self-hosted, macOS, ARM64, rskeeper-xcode27]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/select-xcode.sh   # Xcode de .xcode-version → DEVELOPER_DIR
      - run: scripts/ci/test-drivers.sh
